<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>BudgetMate — Personal Finance Tracker</title>
    <meta name="description" content="Track expenses, scan receipts with AI, and see where your money goes — all in one place. Free personal finance PWA." />
    <meta name="theme-color" content="#1A1A1A" />
    <meta name="color-scheme" content="light dark" />

    <!-- Canonical & robots -->
    <link rel="canonical" href="https://budgetmate.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://budgetmate.vercel.app/" />
    <meta property="og:title" content="BudgetMate — Personal Finance Tracker" />
    <meta property="og:description" content="Track expenses, scan receipts with AI, and see where your money goes — all in one place." />
    <meta property="og:image" content="https://budgetmate.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="BudgetMate" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BudgetMate — Personal Finance Tracker" />
    <meta name="twitter:description" content="Track expenses, scan receipts with AI, and see where your money goes." />
    <meta name="twitter:image" content="https://budgetmate.vercel.app/og-image.png" />

    <!-- PWA / Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BudgetMate" />
    <meta name="application-name" content="BudgetMate" />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BudgetMate",
      "description": "Personal finance PWA for tracking expenses, scanning receipts with AI, and visualising spending.",
      "url": "https://budgetmate.vercel.app/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sahil Lakhani",
        "url": "https://github.com/Sahil-Lakhani"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
